name: Public pricing contract
on: [push, pull_request]
permissions:
  contents: read
jobs:
  pricing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run check:release
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run check:pricing:ui
